<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <title>Silverton | Thank You</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #F2F2F4; color: #111111; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .card { background: #fff; border-radius: 16px; padding: 2rem; max-width: 480px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { color: #3C60C1; margin-top: 0; }
    a { color: #2159A8; font-weight: 700; }
      /* Professional polish pass */
    .btn { transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, opacity 0.15s ease; }
    .btn-primary:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.18); transform: translateY(-1px); }
    .btn-outline:hover { background: rgba(255,255,255,0.15); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 3px solid rgba(60,96,193,0.35); outline-offset: 2px; }
    .main-nav a { transition: color 0.15s ease; }
    .main-nav a:hover { color: var(--color-primary); }
    .card { transition: box-shadow 0.2s ease; }
    .card:hover { box-shadow: 0 10px 26px rgba(0,0,0,0.08); }
    input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(60,96,193,0.22); outline-offset: 1px; }
      /* Redesign refresh v2 - brand navy/teal accents + Poppins headings */
    h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 700; letter-spacing: -0.01em; }
    .logo { font-family: var(--font-heading); }
    .main-nav a { position: relative; padding-bottom: 4px; }
    .main-nav a::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--color-teal, #2fe0d0); transform: scaleX(0); transform-origin: left; transition: transform 0.2s ease; }
    .main-nav a:hover::after { transform: scaleX(1); }
    .btn-primary { background: linear-gradient(135deg, var(--color-accent), var(--color-primary)); letter-spacing: 0.02em; }
    .btn-primary:hover { box-shadow: 0 8px 22px rgba(11,24,54,0.28); }
    .hero-eyebrow { color: #bff5ef; }
    .tire-price { color: #0f8f80; }
  
    /* Final brand override: navy / gold / white */
    :root {
      --color-primary: #00138A;
      --color-accent: #FFC62D;
      --color-highlight: #00138A;
      --color-bg: #FFFFFF;
      --color-bg-alt: #FFFFFF;
      --color-text: #0B1238;
      --color-text-muted: #4A547A;
      --color-navy: #00138A;
      --color-teal: #FFC62D;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
    }

    .top-bar {
      background: #00138A;
      color: #FFFFFF;
    }

    .site-header {
      background: #FFFFFF;
      border-bottom: 1px solid rgba(0, 19, 138, 0.12);
    }

    .main-nav a {
      color: #00138A;
    }

    .main-nav a::after {
      background: #FFC62D;
    }

    .btn-primary {
      background: #FFC62D;
      color: #00138A;
      border-color: #FFC62D;
    }

    .btn-primary:hover {
      background: #E6B325;
    }

    .btn-outline {
      color: #FFFFFF;
      border-color: #FFFFFF;
    }

    .btn-dark-outline,
    .btn-secondary {
      color: #00138A;
      border-color: #00138A;
      background: #FFFFFF;
    }

    .btn-danger {
      background: #FFC62D;
      color: #00138A;
      border-color: #FFC62D;
    }

    .hero {
      background:
        linear-gradient(rgba(11,24,54,0.75), rgba(11,24,54,0.75)),
        url('IMG/silvertonheadNW.png') center/cover no-repeat;
      color: #FFFFFF;
    }

    .card,
    .coupon-card,
    .offer-card {
      border: 1px solid rgba(0, 19, 138, 0.12);
    }

    .card h2,
    .coupon-title,
    .offer-card h3,
    .logo {
      color: #00138A;
    }

    .shop-view-all {
      color: #00138A;
    }

    .shop-brand-chip {
      background: #FFFFFF;
      border: 1px solid rgba(0, 19, 138, 0.2);
      color: #00138A;
    }

    .edit-button {
      background: #FFC62D;
      color: #00138A;
    }

    .clear-storage-btn {
      color: #00138A;
      border-color: #00138A;
    }

    .hero-eyebrow {
      color: #FFC62D;
    }

    .tire-price {
      color: #00138A;
    }
  
    /* Brand typography/color lock (no hero-image changes) */
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading, 'Poppins', Arial, Helvetica, sans-serif);
      color: #00138A;
    }

    .logo,
    .main-nav a,
    .main-nav a:visited,
    .shop-dropdown-title,
    .shop-view-all,
    .coupon-title,
    .offer-card h3,
    .card h2,
    .card h3,
    .section h2,
    .hero-card h2,
    .hero-subtitle,
    .compat-label,
    .tire-brand,
    label {
      color: #00138A !important;
    }

    .hero-eyebrow,
    .tire-price,
    .placeholder {
      color: #FFC62D !important;
    }

    a:not(.btn):hover,
    a:not(.btn):focus-visible {
      color: #00138A;
    }`r`n  </style>
</head>
<body>
  <div class="card">
    <h1>Thank You</h1>
    <p>Your message has been sent successfully.</p>
    <p><a href="index.html">Return to the site</a></p>
  </div>
</body>
</html>
